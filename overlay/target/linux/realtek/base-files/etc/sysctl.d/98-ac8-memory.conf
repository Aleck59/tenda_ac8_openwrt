# Tenda AC8 port: 55 MB of usable RAM.  /etc/init.d/sysctl sets
# vm.min_free_kbytes=8192 for 64 MB boards, and the kernel boosted the
# watermarks by another 16 MB on fragmentation (boost:16384kB,
# min:24576kB in the OOM report): hostapd was killed while the Wi-Fi
# driver filled its RX ring.  No boost, a 4 MB reserve.
vm.min_free_kbytes = 4096
vm.watermark_boost_factor = 0
