name: Build OpenWrt 19.07 (Tenda AC8 v1)

on:
  workflow_dispatch:
    inputs:
      extra_packages:
        description: "Extra packages for the image, space separated"
        default: ""
        type: string
      release:
        description: "Publish the images as a GitHub release"
        default: true
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"
      - "base.env"
      - "configs/**"
      - "target/**"
      - "patches/**"
      - "scripts/prepare.sh"
      - "scripts/configure.sh"
      - "scripts/make-fullflash.py"
      - "boot/**"

permissions:
  contents: write
  # Delete superseded caches, see "Delete superseded caches".
  actions: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  EXTRA_PACKAGES: ${{ inputs.extra_packages || '' }}

jobs:
  build:
    # OpenWrt 19.07 needs Python 2 and an older host compiler: Ubuntu 22.04
    # (the build host of the HH71VM port).
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Release tag
        id: tag
        run: echo "tag=ac8-19.07-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential flex bison gawk gettext git \
            libncurses-dev libssl-dev libelf-dev python2 python3 rsync unzip zip \
            zlib1g-dev file wget curl time subversion swig perl pkg-config \
            squashfs-tools xz-utils bzip2 patch diffutils libtool autoconf automake

      - name: Prepare source tree
        run: ./scripts/prepare.sh "$GITHUB_WORKSPACE/openwrt"

      - name: Configure
        run: ./scripts/configure.sh openwrt "$EXTRA_PACKAGES"

      # Host tools and the cross toolchain depend only on the pinned tree and
      # on the target and compiler settings.
      - name: Cache keys
        id: cache-keys
        env:
          DL_HASH: ${{ hashFiles('base.env', 'scripts/prepare.sh', 'configs/**', 'patches/**') }}
        run: |
          sum=$( { cat base.env
            grep -E '^CONFIG_(TARGET_BOARD|TARGET_SUBTARGET|TARGET_ARCH_PACKAGES|CPU_TYPE|ARCH|TARGET_OPTIMIZATION|EXTRA_OPTIMIZATION|SOFT_FLOAT|USE_MIPS16|USE_MUSL|USE_GLIBC|BINUTILS_|GCC_|LIBC|TARGET_SUFFIX|TOOLCHAINOPTS|EXTERNAL_TOOLCHAIN)' openwrt/.config
          } | sha256sum | cut -c1-40)
          echo "dl=dl19-$DL_HASH" >> "$GITHUB_OUTPUT"
          echo "toolchain=toolchain19-${{ runner.os }}-$sum" >> "$GITHUB_OUTPUT"

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: ${{ steps.cache-keys.outputs.dl }}
          restore-keys: dl19-

      - name: Cache tools and toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          # 19.07 keeps the stamp of the host tools in the target staging dir.
          path: |
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/staging_dir/target-*/stamp/.tools_compile_*
          key: ${{ steps.cache-keys.outputs.toolchain }}

      # A fresh checkout makes every source file newer than the cached build
      # stamps; touch them so make treats the restored tools as up to date.
      - name: Mark cached tools and toolchain as built
        if: steps.cache-toolchain.outputs.cache-hit == 'true'
        working-directory: openwrt
        run: find staging_dir/host/stamp staging_dir/toolchain-*/stamp staging_dir/target-*/stamp -type f -exec touch {} +

      # Keep only the caches of the current keys (and none of the OpenWrt
      # 24.10 builds).
      - name: Delete superseded caches
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DL_KEY: ${{ steps.cache-keys.outputs.dl }}
          TOOLCHAIN_KEY: ${{ steps.cache-keys.outputs.toolchain }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json id,key --jq '.[] | "\(.id) \(.key)"' |
          while read -r id key; do
            case "$key" in
              "$DL_KEY"|"$TOOLCHAIN_KEY") ;;
              dl*|toolchain*)
                echo "deleting $key"
                gh cache delete "$id" --repo "$GITHUB_REPOSITORY" ;;
            esac
          done

      - name: Download sources
        working-directory: openwrt
        run: make download -j8 || make download -j1 V=s

      - name: Build tools and toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        working-directory: openwrt
        run: |
          echo "CPU cores: $(nproc), RAM: $(free -g | awk '/Mem:/ {print $2}') GiB"
          make -j"$(nproc)" tools/install toolchain/install || make -j1 V=s tools/install toolchain/install

      - name: Build firmware
        working-directory: openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" 2>&1 | tee build.log || make -j1 V=s

      # The release carries what gets written to the router: the full chip
      # image with the boot loader (from flash.bin), flash.bin itself (for the
      # boot loader or a programmer, at 0x20000) and sysupgrade.bin for LuCI.
      - name: Collect images
        run: |
          src=openwrt/bin/targets/rtkmipsel/rtl8197f
          ls -l "$src"
          mkdir -p out
          for size in 8m 16m; do
            fw=$(ls "$src"/*-tenda_ac8-v1-$size-squashfs-flash.bin) ||
              { echo "::error::no flash image for $size"; exit 1; }
            cp "$fw" "$src"/*-tenda_ac8-v1-$size-squashfs-sysupgrade.bin out/
            if [ -f boot/tenda_ac8-v1-boot.bin ]; then
              full="out/$(basename "${fw%-squashfs-flash.bin}")-fullflash.bin"
              python3 scripts/make-fullflash.py --boot boot/tenda_ac8-v1-boot.bin \
                --firmware "$fw" --size "${size^^}" --output "$full"
              rm -f "$full.layout"
            else
              echo "::notice::boot/tenda_ac8-v1-boot.bin is not in the repository, no fullflash image"
            fi
          done
          {
            cat docs/release-notes.md
            echo
            echo '### SHA-256'
            echo
            echo '```'
            (cd out && sha256sum *.bin)
            echo '```'
          } > release-body.md
          ls -l out

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-19.07-tenda-ac8-${{ github.run_number }}
          path: out/

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            openwrt/logs/
            openwrt/.config
            openwrt/build.log
          if-no-files-found: ignore

      - name: Publish release
        if: github.event_name == 'push' || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OpenWrt 19.07 для Tenda AC8 v1 (${{ steps.tag.outputs.tag }})
          prerelease: true
          body_path: release-body.md
          files: out/*.bin
