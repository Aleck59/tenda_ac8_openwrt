name: Build firmware

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Release tag to create, e.g. v1.0.0 or v1.1.0-rc1 (empty: build only)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.release }}

permissions:
  contents: read

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          set -e
          for f in scripts/*.sh openwrt/target/linux/rtl819x/base-files/etc/board.d/* \
                   openwrt/target/linux/rtl819x/base-files/etc/uci-defaults/* \
                   openwrt/target/linux/rtl819x/base-files/lib/upgrade/platform.sh; do
            sh -n "$f"
          done
          shellcheck -S warning scripts/*.sh

      - name: Python tools
        run: |
          python3 -m py_compile scripts/*.py openwrt/target/linux/rtl819x/image/*.py
          python3 scripts/mkflash.py --help >/dev/null
          python3 scripts/ac8_nvram.py --help >/dev/null
          python3 tests/test_tools.py -v
          (cd boot && sha256sum -c SHA256SUMS)

      - name: Device tree
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq device-tree-compiler cpp >/dev/null
          cd openwrt/target/linux/rtl819x/dts
          git clone -q --depth 1 --filter=blob:none --sparse \
            https://github.com/torvalds/linux.git /tmp/linux
          git -C /tmp/linux sparse-checkout set include/dt-bindings >/dev/null
          cpp -nostdinc -undef -x assembler-with-cpp -I. -I/tmp/linux/include \
            rtl8197f-tenda-ac8.dts | dtc -I dts -O dtb -W no-unit_address_vs_reg -o /tmp/ac8.dtb -

  build:
    name: Tenda AC8 v1
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd >/dev/null

      - name: Version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          if [ -n "$RELEASE" ]; then
            [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || {
              echo "::error::release must look like v1.2.3 or v1.2.3-rc1"; exit 1; }
            ver="$RELEASE"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ver="${GITHUB_REF_NAME}"
          else
            ver="$(git describe --tags --always --dirty 2>/dev/null || echo "${GITHUB_SHA::7}")"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          {
            echo 'CONFIG_IMAGEOPT=y'
            echo 'CONFIG_VERSIONOPT=y'
            echo "CONFIG_VERSION_CODE=\"ac8-$ver\""
            echo '# CONFIG_VERSION_FILENAMES is not set'
            echo 'CONFIG_VERSION_CODE_FILENAMES=y'
            echo 'CONFIG_VERSION_MANUFACTURER_URL="https://github.com/${{ github.repository }}"'
            echo 'CONFIG_VERSION_SUPPORT_URL="https://github.com/${{ github.repository }}/issues"'
          } > "$RUNNER_TEMP/version.config"

      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: build/openwrt/dl
          key: dl-${{ hashFiles('configs/*') }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ hashFiles('configs/*') }}-
            dl-

      - name: Prepare OpenWrt tree
        env:
          CONFIG_EXTRA: ${{ runner.temp }}/version.config
        run: ./scripts/prepare.sh

      - name: Build
        env:
          SKIP_PREPARE: 1
        run: ./scripts/build.sh

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: tenda-ac8-${{ steps.version.outputs.version }}
          path: out/
          if-no-files-found: error

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/openwrt/logs/
            build/openwrt/tmp/*.log
          if-no-files-found: ignore

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release notes
        env:
          VER: ${{ needs.build.outputs.version }}
        run: |
          ver="$VER"
          dir="$(ls -d artifacts/tenda-ac8-*)"
          {
            sed -e "s/@VERSION@/$ver/g" -e "s|@REPO@|$GITHUB_REPOSITORY|g" docs/release-notes.md
            echo
            echo '### SHA-256'
            echo '```'
            cat "$dir/sha256sums"
            echo '```'
          } > release-notes.md
          echo "DIR=$dir" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Tenda AC8 OpenWrt ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: |
            ${{ env.DIR }}/*.bin
            ${{ env.DIR }}/sha256sums
            ${{ env.DIR }}/*.manifest
            ${{ env.DIR }}/config.buildinfo
            ${{ env.DIR }}/feeds.buildinfo
            ${{ env.DIR }}/version.buildinfo
